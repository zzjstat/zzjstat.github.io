  interests: 我的研究兴趣包括高维数据、迁移学习与网络数据。
  bio_research: 我的研究兴趣包括高维统计、迁移学习与网络数据分析。目前的工作主要研究异质数据之间的信息共享：当来源与目标总体存在差异，或不同研究测量的变量不一致时，如何有选择地利用来源信息，帮助目标总体上的统计估计。我结合统计理论与数值实验，考察来源信息何时有用，以及如何减少不恰当的信息借用造成的负迁移。
  background: 我于2023年在北京师范大学获得统计学学士学位，并于同年进入博士阶段学习。
  teaching_intro: 我曾担任《统计学导论 B》和《非参数统计》的助教，并在统计学导论课程中承担 R 语言教学。我整理的
