{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% if page.home or page.translation_zh %}
<link rel="alternate" hreflang="zh-CN" href="{{ page.translation_zh | default: '/zh/' | prepend: base_path }}">
<link rel="alternate" hreflang="en" href="{{ page.translation_en | default: '/' | prepend: base_path }}">
<link rel="alternate" hreflang="x-default" href="{{ page.translation_en | default: '/' | prepend: base_path }}">
{% endif %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ ui.feed_title | escape }}">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  try {
    var savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || savedTheme === 'light') {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  } catch (error) { /* System colors work even when storage is unavailable. */ }
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
